server:
  port: ${SERVER_PORT_GATEWAY}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - ${CORS_ALLOWED_ORIGINS}
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**
          filters:
            - RewritePath=/api/users, /api/v1/users
            - RewritePath=/api/users/(?<segment>.*), /api/v1/users/${segment}

        - id: menu_service_route
          uri: lb://MENU-SERVICE
          predicates:
            - Path=/api/menu/**
          filters:
            - RewritePath=/api/menu/(?<segment>.*), /api/v1/menu/${segment}

        - id: ordering_service_route
          uri: lb://ORDERING-SERVICE
          predicates:
            - Path=/api/admin/orders, /api/admin/orders/** ,/api/orders, /api/orders/**
          filters:
            - RewritePath=/api/admin/orders, /api/v1/admin/orders
            - RewritePath=/api/admin/orders/(?<segment>.*), /api/v1/admin/orders/${segment}
            - RewritePath=/api/orders, /api/v1/orders
            - RewritePath=/api/orders/(?<segment>.*), /api/v1/orders/${segment}

        - id: basket_service_route
          uri: lb://BASKET-SERVICE
          predicates:
            - Path=/api/basket,/api/basket/**
          filters:
            - RewritePath=/api/basket, /api/v1/basket
            - RewritePath=/api/basket/(?<segment>.*), /api/v1/basket/${segment}

        - id: payment_service_route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment/(?<segment>.*), /api/v1/payment/${segment}

eureka:
  client:
    fetchRegistry: ${EUREKA_FETCH_REGISTRY}
    registerWithEureka: ${EUREKA_REGISTER_WITH_EUREKA}
    serviceUrl:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_ID}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE}
  endpoint:
    gateway:
      enabled: ${MANAGEMENT_GATEWAY_ENABLED}
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS}
