server:
  port: ${SERVER_PORT_GATEWAY:9000}

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "${FRONTEND_URL:http://localhost:3000}"
              - "${FRONTEND_URL_ADMIN:http://localhost:3001}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
      
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

      routes:
        - id: menu_service_route
          uri: lb://MENU-SERVICE
          predicates:
            - Path=/api/menu/**
          filters:
            - RewritePath=/api/menu/(?<segment>.*), /api/v1/menu/${segment}

        - id: admin_orders_route
          uri: lb://ORDERING-SERVICE
          predicates:
            - Path=/api/admin/orders, /api/admin/orders/**
          filters:
            - RewritePath=/api/admin/orders, /api/v1/admin/orders
            - RewritePath=/api/admin/orders(?<segment>/?.*), /api/v1/admin/orders${segment}

        - id: user_orders_route
          uri: lb://ORDERING-SERVICE
          predicates:
            - Path=/api/orders/**
          filters:
            - RewritePath=/api/orders(?<segment>/?.*), /api/v1/orders${segment}

        - id: basket_service_route
          uri: lb://BASKET-SERVICE
          predicates:
            - Path=/api/basket,/api/basket/**
          filters:
            - RewritePath=/api/basket, /api/v1/basket
            - RewritePath=/api/basket/(?<segment>.*), /api/v1/basket/${segment}

        - id: payment_service_route
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/api/payment/**
          filters:
            - RewritePath=/api/payment/(?<segment>.*), /api/v1/payment/${segment}

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/users/**, /api/admin/**
          filters:
            - RewritePath=/api/users, /api/v1/users
            - RewritePath=/api/admin/(?<segment>.*), /api/v1/admin/${segment}
            - RewritePath=/api/users/(?<segment>.*), /api/v1/users/${segment}


eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted