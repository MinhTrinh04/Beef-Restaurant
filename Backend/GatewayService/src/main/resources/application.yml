server:
  port: 9000

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      server:
        webflux:
          routes:
          - id: user-service
            uri: lb://USER-SERVICE
            predicates:
              - Path=/api/users/**
            filters:
              - RewritePath=/api/users, /api/v1/users
              - RewritePath=/api/users/(?<segment>.*), /api/v1/users/${segment}

          - id: menu_service_route
            uri: lb://MENU-SERVICE
            predicates:
              - Path=/api/menu/**
            filters:
              - RewritePath=/api/menu/(?<segment>.*), /api/v1/menu/${segment}

          - id: ordering_service_route
            uri: lb://ORDERING-SERVICE
            predicates:
              - Path=/api/orders,/api/orders/**
            filters:
              - RewritePath=/api/orders, /api/v1/orders
              - RewritePath=/api/orders/(?<segment>.*), /api/v1/orders/${segment}

          - id: basket_service_route
            uri: lb://BASKET-SERVICE
            predicates:
              - Path=/api/basket,/api/basket/**
            filters:
              - RewritePath=/api/basket, /api/v1/basket
              - RewritePath=/api/basket/(?<segment>.*), /api/v1/basket/${segment}

          - id: payment_service_route
            uri: lb://PAYMENT-SERVICE
            predicates:
              - Path=/api/payment/**
            filters:
              - RewritePath=/api/payment/(?<segment>.*), /api/v1/payment/${segment}

        default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Credentials Access-Control-Allow-Origin

        globalcors:
          cors-configurations:
            '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    gateway:
      access: unrestricted