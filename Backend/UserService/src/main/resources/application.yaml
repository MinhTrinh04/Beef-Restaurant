server:
  port: 8085
spring:
  application:
    name: "user-service"

  datasource:
    url: jdbc:h2:mem:userdb
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/master

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

keycloak:
  server-url: http://localhost:8180
  realm: master
  client-id: test-user
  client-secret: CVyEApmC2fpBYTAr6arwl6P2VztQwKJ5
  admin-username: admin
  admin-password: admin