server:
  port: 8085
spring:
  application:
    name: "user-service"

  datasource:
    url: jdbc:h2:mem:userdb
    username: sa
    password: ''
    driver-class-name: org.h2.Driver

  h2:
    console:
      enabled: true
      path: /h2-console

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/master