server:
    port: ${SERVER_PORT_ORDERING:8082}

spring:
    application:
        name: "ordering-service"

    datasource:
        url: jdbc:h2:mem:orderingdb
        driver-class-name: org.h2.Driver
        username: sa
        password: ''

    h2:
        console:
            enabled: true
            path: /h2-console

    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.H2Dialect

    flyway:
        enabled: true
        locations: classpath:db/migration
        baseline-on-migrate: true

    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest
        virtual-host: /

    security:
      oauth2:
        resourceserver:
          jwt:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8180/realms/beef}

app:
  payment:
    timeout-minutes: 15

logging:
    level:
        com.eshop.OrderingService: DEBUG
        org.springframework.amqp: DEBUG

eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
      
management:
  endpoints:
    web:
      exposure:
        include: "*"