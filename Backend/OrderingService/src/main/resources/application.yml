spring:
    application:
        name: OrderingService
    datasource:
        url: jdbc:h2:mem:testdb
        driver-class-name: org.h2.Driver
        username: sa
        password: password
    h2:
        console:
            enabled: true
    jpa:
        hibernate:
            ddl-auto: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
    flyway:
        enabled: true
        locations: classpath:db/migration
    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest
        exchange: eshop.event_bus

server:
    port: 8082

logging:
    level:
        com.eshop.OrderingService: DEBUG
        org.springframework.web: DEBUG


