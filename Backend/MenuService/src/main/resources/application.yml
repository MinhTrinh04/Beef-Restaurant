server:
  port: ${SERVER_PORT_MENU}

spring:
  application:
    name: "menu-service"

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}

  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED}
      path: ${H2_CONSOLE_PATH}

  jpa:
    show-sql: ${JPA_SHOW_SQL}
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO}
    properties:
      hibernate:
        format_sql: ${JPA_FORMAT_SQL}
        dialect: ${JPA_DIALECT}

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

eureka:
  client:
    fetchRegistry: ${EUREKA_FETCH_REGISTRY}
    registerWithEureka: ${EUREKA_REGISTER_WITH_EUREKA}
    serviceUrl:
      defaultZone: ${EUREKA_URI}
  instance:
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS}
    instance-id: ${spring.application.name}:${EUREKA_INSTANCE_ID}

management:
  endpoints:
    web:
      exposure:
        include: ${MANAGEMENT_ENDPOINTS_INCLUDE}
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS}
