apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-service
  namespace: beef-restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway-service
  template:
    metadata:
      labels:
        app: gateway-service
    spec:
      containers:
        - name: gateway-service
          image: minh28012004/gateway-service:latest
          ports:
            - containerPort: 9000
          env:
            - name: SPRING_APPLICATION_NAME
              value: gateway-service
            - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
              value: http://discovery-service:8761/eureka/
            
            - name: FRONTEND_URL
              value: "https://beef.trungkienit.cloud"
            - name: FRONTEND_URL_ADMIN
              value: "https://beef-admin.trungkienit.cloud"
            # Assuming Gateway uses Eureka (lb://) for routing as per docker-compose
            # Full Route Configuration (ID, URI, Predicates)
            # 0: User Service (Users + Admin)
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_ID
              value: user-service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_URI
              value: lb://USER-SERVICE
            - name: SPRING_CLOUD_GATEWAY_ROUTES_0_PREDICATES_0
              value: Path=/api/v1/users/**, /api/v1/user/**, /api/v1/admin/login, /api/v1/admin/refresh, /api/v1/admin/logout, /api/v1/admin/me

            # 1: Menu Service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_ID
              value: menu-service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_URI
              value: lb://MENU-SERVICE
            - name: SPRING_CLOUD_GATEWAY_ROUTES_1_PREDICATES_0
              value: Path=/api/v1/menu/**, /api/v1/menus/**, /api/v1/admin/menu/**

            # 2: Ordering Service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_ID
              value: ordering-service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_URI
              value: lb://ORDERING-SERVICE
            - name: SPRING_CLOUD_GATEWAY_ROUTES_2_PREDICATES_0
              value: Path=/api/v1/orders/**, /api/v1/admin/orders/**

            # 3: Basket Service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_3_ID
              value: basket-service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_3_URI
              value: lb://BASKET-SERVICE
            - name: SPRING_CLOUD_GATEWAY_ROUTES_3_PREDICATES_0
              value: Path=/api/v1/basket/**

            # 4: Payment Service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_4_ID
              value: payment-service
            - name: SPRING_CLOUD_GATEWAY_ROUTES_4_URI
              value: lb://PAYMENT-SERVICE
            - name: SPRING_CLOUD_GATEWAY_ROUTES_4_PREDICATES_0
              value: Path=/api/payment/**
            - name: SPRING_CLOUD_GATEWAY_ROUTES_4_FILTERS_0
              value: RewritePath=/api/payment/(?<segment>.*), /api/v1/payment/${segment}
      initContainers:
        - name: check-discovery
          image: alpine
          command: ['sh', '-c', 'apk add --no-cache netcat-openbsd && until nc -z discovery-service 8761; do echo waiting for discovery; sleep 2; done;']
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: beef-restaurant
spec:
  ports:
    - port: 9000
      targetPort: 9000
  selector:
    app: gateway-service
