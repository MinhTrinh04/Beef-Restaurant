apiVersion: apps/v1
kind: Deployment
metadata:
  name: fe-admin
  namespace: beef-restaurant
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fe-admin
  template:
    metadata:
      labels:
        app: fe-admin
    spec:
      hostAliases:
        - ip: "192.168.1.33"
          hostnames:
            - "beef-api.trungkienit.cloud"
            - "beef-auth.trungkienit.cloud"
            - "api.beef.local"
            - "auth.beef.local"
            - "app.beef.local"
            - "admin.beef.local"
      containers:
        - name: fe-admin
          image: minh28012004/fe-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
          env:
            # Public API URL (used by client-side)
            - name: NEXT_PUBLIC_API_URL
              value: "https://beef-api.trungkienit.cloud"
            
            # NextAuth Configuration
            - name: NEXTAUTH_URL
              value: "https://beef-admin.trungkienit.cloud"
            - name: NEXTAUTH_SECRET
              valueFrom:
                secretKeyRef:
                  name: beef-secrets
                  key: nextauth-secret-admin
            
            # Node Environment
            - name: NODE_ENV
              value: "production"
            
            # Internal API URL (for server-side API calls)
            - name: INTERNAL_API_BASE_URL
              value: "http://gateway-service:9000"
            
            # Disable TLS verification for internal calls (if needed)
            - name: NODE_TLS_REJECT_UNAUTHORIZED
              value: "0"
---
apiVersion: v1
kind: Service
metadata:
  name: fe-admin
  namespace: beef-restaurant
spec:
  ports:
    - port: 3001
      targetPort: 3001
  selector:
    app: fe-admin
