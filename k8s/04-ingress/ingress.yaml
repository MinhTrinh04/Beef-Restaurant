apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: beef-ingress
  namespace: beef-restaurant
  annotations:
    kubernetes.io/ingress.class: "traefik"
spec:
  rules:
    - host: app.beef.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 3000
    - host: admin.beef.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: fe-admin
                port:
                  number: 80
    - host: api.beef.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gateway-service
                port:
                  number: 9000
    - host: auth.beef.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8080
